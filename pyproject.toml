[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todoist-telegram-bot"
version = "1.0.0"
description = "A Telegram bot for managing a Todoist project"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=22,<23",
    "todoist-api-python>=3,<4",
    "markdown-it-py>=3,<5",
    "linkify-it-py>=2,<3",
]

[project.scripts]
todoist-telegram-bot = "todoist_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/todoist_bot"]

[tool.black]
target-version = ["py310"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
